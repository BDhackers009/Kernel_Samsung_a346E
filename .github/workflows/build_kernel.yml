###############################################################################
# Build A346E Kernel -- Samsung Galaxy A34 5G (a34x), MediaTek mt6877, GKI 6.6
#
# Pipeline (7 boxes, linear):
#   #1 Checkout & Detect -> #2 System Prep -> #3 External Deps -> #4 Patches
#     -> #5 KernelSU -> #6 Build -> #7 Upload & Summary
#
# #1..#5 are FAST pre-flight jobs (~1 min each): they validate everything the
# build needs so a broken patch fails the run in a minute instead of 50 minutes
# into the compile.
# #6 is the real build: it is self-contained (it re-does checkout, deps, KSU,
# patches) because every job runs on its OWN fresh runner. That is also why the
# permissive patch is applied by build_kernel.sh (apply_optional_patches) and
# not by a pre-flight job.
#
# Variants (workflow_dispatch):
#   ksu_variant = NO-ROOT | KSUN-DEV | KSUN-STABLE
#     KSUN-DEV    -> KernelSU-Next  dev branch HEAD
#                    (kernel/setup.sh from .../KernelSU-Next/dev,  arg: dev)
#     KSUN-STABLE -> KernelSU-Next  latest stable
#                    (kernel/setup.sh from .../KernelSU-Next/next, arg: stable)
#   susfs = true/false
#     true -> SUSFS from https://github.com/BS1388/SUSFS is applied to the
#             kernel (50_add_susfs_in_gki-android15-6.6.patch + fs/ + include/)
#             AND to KernelSU-Next (10_enable_susfs_for_ksu.patch).
#             SUSFS patches FAIL THE RUN when they do not apply (no more silent
#             "warning: failed / already applied").
#
# A push to A346E / Game builds KSUN-DEV without SUSFS.
#
# Output: the built Image is dropped into https://github.com/BS1388/AnyKernel3-a34x
# and the FINAL flashable AnyKernel3 zip is uploaded as the artifact.
###############################################################################
name: Build A346E Kernel

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "Choose KernelSU variant"
        required: true
        type: choice
        options:
          - NO-ROOT
          - KSUN-DEV
          - KSUN-STABLE
        default: KSUN-DEV
      susfs:
        description: "Apply SUSFS (BS1388/SUSFS) to kernel + KernelSU-Next?"
        type: boolean
        required: true
        default: false
      permissive:
        description: "Make SELinux permissive?"
        type: boolean
        required: true
        default: false
      custom_patches:
        description: "Also apply extra patches from patch/*.patch?"
        type: boolean
        required: true
        default: false
  push:
    branches:
      - A346E
      - Game
  pull_request:
    branches:
      - A346E
      - Game

permissions:
  contents: read
  issues: write

# a newer push on the same branch supersedes older, still running builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  G_EXT: ${{ github.workspace }}/external_deps
  SUSFS_REPO: https://github.com/BS1388/SUSFS.git
  ANYKERNEL_REPO: https://github.com/BS1388/AnyKernel3-a34x.git
  # workflow_dispatch: whatever the user picked.
  # push: build KSUN-DEV (that is the variant we actually flash).
  KSU_VAR: ${{ github.event.inputs.ksu_variant || (github.event_name == 'push' && 'KSUN-DEV') || 'NO-ROOT' }}
  SUSFS: ${{ github.event.inputs.susfs || 'false' }}
  PERMISSIVE: ${{ github.event.inputs.permissive || 'false' }}
  CUSTOM_PATCH: ${{ github.event.inputs.custom_patches || 'false' }}

jobs:
  # ==========================================================================
  # #1 Checkout & Detect
  # ==========================================================================
  detect:
    name: "#1 Checkout & Detect"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Detect kernel tree & build options
        id: detect
        run: |
          set -eu
          if [ "$SUSFS" = "true" ] && [ "$KSU_VAR" = "NO-ROOT" ]; then
            echo "::error::SUSFS needs KernelSU - pick KSUN-DEV or KSUN-STABLE (or untick susfs)"; exit 1
          fi
          if [ -f "Kernel-6.6/Makefile" ]; then
            REAL_DIR="Kernel-6.6"
          elif [ -f "kernel-6.6/Makefile" ]; then
            REAL_DIR="kernel-6.6"
          else
            echo "::error::No kernel tree found (looked for Kernel-6.6/ and kernel-6.6/)"; ls -la; exit 1
          fi
          [ -f "$REAL_DIR/arch/arm64/configs/gki_defconfig" ] \
            || { echo "::error::gki_defconfig missing in $REAL_DIR"; exit 1; }

          SEL=$([ "$PERMISSIVE" = "true" ] && echo permissive || echo enforcing)
          if [ ! -f Google-FDO/kernel.afdo ] && [ -d google-FDO ]; then mv google-FDO Google-FDO; fi
          [ -f Google-FDO/kernel.afdo ] || echo "::warning::Google-FDO/kernel.afdo missing"

          echo "kernel tree : $REAL_DIR ($(grep -m1 -E '^VERSION|^PATCHLEVEL|^SUBLEVEL' -A2 "$REAL_DIR/Makefile" | tr '\n' ' '))"
          echo "KSU variant : $KSU_VAR"
          echo "SUSFS       : $SUSFS"
          echo "SELinux     : $SEL"
          echo "extra patch : $CUSTOM_PATCH"
          {
            echo "## Build A346E Kernel"
            echo ""
            echo "| option | value |"
            echo "|---|---|"
            echo "| KSU variant | \`${KSU_VAR}\` |"
            echo "| SUSFS | \`${SUSFS}\` |"
            echo "| SELinux | \`${SEL}\` |"
            echo "| Extra patches (patch/*.patch) | \`${CUSTOM_PATCH}\` |"
            echo "| Kernel tree | \`${REAL_DIR}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo ""
            echo "### #1 Checkout & Detect - OK"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #2 System Prep
  # ==========================================================================
  system-prep:
    name: "#2 System Prep"
    needs: detect
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check runner resources & toolchain
        run: |
          set -eu
          AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "CPUs: $(nproc) | RAM: $(free -g | awk '/Mem:/{print $2}') GB | free disk: ${AVAIL} GB"
          # #6 frees ~25 GB more (dotnet/ghc/android-sdk) before building
          if [ "$AVAIL" -lt 10 ]; then
            echo "::error::only ${AVAIL} GB free on / - the kleaf build cannot fit"
            exit 1
          elif [ "$AVAIL" -lt 20 ]; then
            echo "::warning::only ${AVAIL} GB free on / before cleanup, build may run tight"
          fi
          for t in git curl python3 tar xz; do command -v "$t" >/dev/null || { echo "::error::missing $t"; exit 1; }; done
          python3 --version; git --version
          echo "### #2 System Prep - OK (${AVAIL} GB free before cleanup)" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #3 External Deps (KernelSU-Next / SUSFS)
  # ==========================================================================
  external-deps:
    name: "#3 External Deps (KSU/SUSFS)"
    needs: system-prep
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check KernelSU-Next source is reachable
        if: env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          if [ "$KSU_VAR" = "KSUN-DEV" ]; then
            URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh"
          else
            URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
          fi
          curl -fsSL --retry 3 "$URL" -o /tmp/setup.sh
          head -n 1 /tmp/setup.sh | grep -q '^#!' || { echo "::error::setup.sh does not look like a script"; exit 1; }
          echo "setup.sh OK ($(wc -l < /tmp/setup.sh) lines) from $URL"

      - name: Fetch & verify SUSFS repo (susfs=true)
        if: env.SUSFS == 'true'
        run: |
          set -eu
          mkdir -p "$G_EXT"
          git clone --depth 1 "$SUSFS_REPO" "$G_EXT/SUSFS"
          P=$(find "$G_EXT/SUSFS" -type f -name '50_add_susfs_in_gki-android15-6.6.patch' -not -path '*/.git/*' | head -n1)
          if [ -z "$P" ]; then
            echo "::error::50_add_susfs_in_gki-android15-6.6.patch not found in $SUSFS_REPO"
            find "$G_EXT/SUSFS" -maxdepth 3 -not -path '*/.git/*' | head -n 40
            exit 1
          fi
          D=$(dirname "$(dirname "$P")")
          MISSING=0
          for f in kernel_patches/50_add_susfs_in_gki-android15-6.6.patch \
                   kernel_patches/fs/susfs.c \
                   kernel_patches/include/linux/susfs.h \
                   kernel_patches/include/linux/susfs_def.h \
                   kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch; do
            if [ -f "$D/$f" ]; then echo "OK      $f"; else echo "::error::MISSING $f"; MISSING=1; fi
          done
          [ "$MISSING" = "0" ] || exit 1
          VER=$(grep -m1 '#define SUSFS_VERSION' "$D/kernel_patches/include/linux/susfs.h" | sed 's/.*"\(.*\)".*/\1/')
          echo "SUSFS version: ${VER:-unknown} @ $(git -C "$G_EXT/SUSFS" rev-parse --short HEAD)"

      - name: Check AnyKernel3 repo (final zip is built from it)
        run: |
          set -eu
          git clone --depth 1 "$ANYKERNEL_REPO" /tmp/ak3
          [ -f /tmp/ak3/anykernel.sh ] || { echo "::error::anykernel.sh not found in $ANYKERNEL_REPO"; ls -la /tmp/ak3; exit 1; }
          echo "AnyKernel3 OK @ $(git -C /tmp/ak3 rev-parse --short HEAD)"
          echo "--- repo root ---"; ls -A /tmp/ak3 | grep -v '^\.git$' || true

      - name: Nothing to fetch (NO-ROOT)
        if: env.KSU_VAR == 'NO-ROOT'
        run: echo "NO-ROOT variant - no external dependencies"

      - name: Summary
        if: always()
        run: |
          set -eu
          echo "### #3 External Deps - OK (${KSU_VAR}, susfs=${SUSFS})" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #4 Patches
  #    Order mirrors the real build (#6 + build_kernel.sh):
  #      1. SUSFS kernel patch (susfs=true)  -> applied FOR REAL here, on this
  #         disposable runner, so everything below is checked against a
  #         SUSFS-patched tree exactly like in #6
  #      2. kernel/patches-kernel-6.6/*.patch (apply_kernel66_patches, always)
  #      3. if PERMISSIVE=true   : Permissive/selinux-make-permissive.patch
  #      4. if CUSTOM_PATCH=true : patch/*.patch  (apply_optional_patches)
  # ==========================================================================
  patches:
    name: "#4 Patches"
    needs: external-deps
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Detect kernel dir
        run: |
          set -eu
          if [ -f "Kernel-6.6/Makefile" ]; then echo "KDIR=Kernel-6.6" >> "$GITHUB_ENV"
          elif [ -f "kernel-6.6/Makefile" ]; then echo "KDIR=kernel-6.6" >> "$GITHUB_ENV"
          else echo "::error::no kernel tree found"; exit 1; fi

      - name: SUSFS kernel patch (susfs=true)
        if: env.SUSFS == 'true'
        run: |
          set -eu
          mkdir -p "$G_EXT"
          git clone --depth 1 "$SUSFS_REPO" "$G_EXT/SUSFS"
          P=$(find "$G_EXT/SUSFS" -type f -name '50_add_susfs_in_gki-android15-6.6.patch' -not -path '*/.git/*' | head -n1)
          [ -n "$P" ] || { echo "::error::50_add_susfs_in_gki-android15-6.6.patch not found in $SUSFS_REPO"; exit 1; }
          D=$(dirname "$(dirname "$P")")

          cp -v "$D"/kernel_patches/include/linux/* "$KDIR/include/linux/"
          cp -v "$D"/kernel_patches/fs/*            "$KDIR/fs/"

          if ! patch -p1 -d "$KDIR" --forward --batch --no-backup-if-mismatch < "$P" > /tmp/susfs_kernel.log 2>&1; then
            cat /tmp/susfs_kernel.log
            echo "::error::SUSFS kernel patch does NOT apply to this kernel tree - rejected hunks:"
            find "$KDIR" -name '*.rej' | head -n 30
            exit 1
          fi
          cat /tmp/susfs_kernel.log
          if find "$KDIR" -name '*.rej' | grep -q .; then
            echo "::error::SUSFS patch left .rej files"; find "$KDIR" -name '*.rej'; exit 1
          fi
          if grep -q 'fuzz' /tmp/susfs_kernel.log; then
            echo "::warning::SUSFS kernel patch applied with fuzz - check the log above"
          fi
          echo "SUSFS kernel patch applies cleanly"

      # kernel-6.6/ is pristine upstream; everything this device needs is a
      # patch in kernel/patches-kernel-6.6/, applied on every build by
      # build_kernel.sh (apply_kernel66_patches -> that folder's apply.sh).
      - name: kernel-6.6 patches (always applied)
        run: |
          set -eu
          A="kernel/patches-kernel-6.6/apply.sh"
          [ -f "$A" ] || { echo "::error::$A missing"; exit 1; }
          chmod +x "$A"
          bash "$A" --check "$KDIR"

      # These fixes live directly in Samsung's own trees (vendor/,
      # kernel/kernel_device_modules-6.6/) because we never replace those
      # wholesale - just make sure none of them got lost.
      - name: Verify in-tree fixes (vendor / device modules)
        run: |
          set -eu
          FAIL=0
          check() { # check <description> <file> <grep-pattern>
            if [ -f "$2" ] && grep -q "$3" "$2"; then
              echo "OK      $1"
            else
              echo "::error::MISSING $1  ($2)"; FAIL=1
            fi
          }
          check "SEC_PM Kconfig"           "kernel/kernel_device_modules-6.6/drivers/samsung/pm/Kconfig" "config SEC_PM"
          check "MAX/MIN guard (stp_uart)" "vendor/mediatek/kernel_modules/connectivity/common/common_main/linux/stp_uart.c" "#ifndef MAX"

          # audio: both BTCVSD fixes must survive (call crackle resync and the
          # mic-start pop silence priming)
          check "BTCVSD SCO resync/xrun recovery" "kernel/kernel_device_modules-6.6/sound/soc/mediatek/common/mtk-btcvsd.c" "mtk_btcvsd_snd_band_resync"
          check "BTCVSD rx overrun self-recovery" "kernel/kernel_device_modules-6.6/sound/soc/mediatek/common/mtk-btcvsd.c" "mtk_btcvsd_snd_rx_resync"
          check "BTCVSD silence priming"          "kernel/kernel_device_modules-6.6/sound/soc/mediatek/common/mtk-btcvsd.c" "mtk_btcvsd_snd_silence_prime"

          # zram: upstream line is `= CONFIG_ZRAM_DEF_COMP;`. A hand-edit once
          # turned it into `= lzo-rle;` (no quotes) -> build error.
          Z="$KDIR/drivers/block/zram/zram_drv.c"
          if grep -qE '^static const char \*default_compressor = (CONFIG_ZRAM_DEF_COMP|"[a-z0-9-]+");' "$Z"; then
            echo "OK      zram default_compressor is valid C"
          else
            echo "::error::BROKEN zram default_compressor:"; grep -n "default_compressor =" "$Z" || true; FAIL=1
          fi

          # Samsung-only cred API must be gone from the modules we build
          if grep -rl --include=*.c --include=*.h "get_current_cred_module\|put_cred_module" vendor 2>/dev/null | grep -q .; then
            echo "::error::get_current_cred_module/put_cred_module still present in vendor/:"
            grep -rl --include=*.c --include=*.h "get_current_cred_module\|put_cred_module" vendor 2>/dev/null | sed 's/^/          /'
            FAIL=1
          else
            echo "OK      no Samsung-only cred API in vendor/ (the modules we build)"
          fi

          [ "$FAIL" = "0" ] || { echo "::error::a fix is missing from the source tree - the build would fail"; exit 1; }

      - name: SELinux permissive patch (PERMISSIVE=true)
        if: env.PERMISSIVE == 'true'
        run: |
          set -eu
          P="Permissive/selinux-make-permissive.patch"
          [ -f "$P" ] || { echo "::error::PERMISSIVE=true but $P is missing"; exit 1; }
          if patch -p1 -d "$KDIR" --dry-run --forward --batch < "$P" > /tmp/perm.log 2>&1; then
            echo "APPLIES $(basename "$P") -> $KDIR"
          elif grep -q "Reversed (or previously applied)" /tmp/perm.log; then
            echo "ALREADY $(basename "$P")"
          else
            echo "::error::permissive patch does not apply"; cat /tmp/perm.log; exit 1
          fi
          echo "SELinux will be PERMISSIVE (applied for real in #6 by build_kernel.sh)"

      - name: Skip permissive (PERMISSIVE=false)
        if: env.PERMISSIVE != 'true'
        run: echo "PERMISSIVE=false -> SELinux stays enforcing, permissive patch not applied"

      - name: Extra patches from patch/*.patch (CUSTOM_PATCH=true)
        if: env.CUSTOM_PATCH == 'true'
        run: |
          set -eu
          shopt -s nullglob
          EXTRA=(patch/*.patch)
          shopt -u nullglob
          if [ ${#EXTRA[@]} -eq 0 ]; then
            echo "::warning::CUSTOM_PATCH=true but patch/ has no *.patch file (kernel/patches-kernel-6.6/ is applied anyway)"
            exit 0
          fi
          FAIL=0
          for p in "${EXTRA[@]}"; do
            base=$(basename "$p")
            if patch -p1 -d "$KDIR" --dry-run --forward --batch < "$p" > /tmp/out.log 2>&1; then
              echo "APPLIES $base -> $KDIR"
            elif grep -q "Reversed (or previously applied)" /tmp/out.log; then
              echo "ALREADY $base"
            else
              echo "::error::BROKEN  $base"; sed 's/^/          /' /tmp/out.log; FAIL=1
            fi
          done
          [ "$FAIL" = "0" ] || exit 1
          echo "extra patches: ${#EXTRA[@]} checked (applied for real in #6 by build_kernel.sh)"

      - name: Summary
        run: |
          {
            echo "### #4 Patches - OK"
            echo "- SUSFS kernel patch: \`${SUSFS}\`"
            echo "- kernel-6.6 patches (\`kernel/patches-kernel-6.6/\`): validated"
            echo "- permissive patch: \`${PERMISSIVE}\`"
            echo "- extra patches (\`patch/*.patch\`): \`${CUSTOM_PATCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #5 KernelSU -- resolve the version that #6 will build, and (susfs=true)
  #    dry-run the SUSFS KernelSU patch against it. 10_enable_susfs_for_ksu is
  #    written for upstream KernelSU, so THIS is where you find out in one
  #    minute whether it fits KernelSU-Next.
  # ==========================================================================
  kernelsu:
    name: "#5 KernelSU"
    needs: patches
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Resolve KernelSU-Next version
        id: resolve
        if: env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          REPO=https://github.com/KernelSU-Next/KernelSU-Next.git
          if [ "$KSU_VAR" = "KSUN-DEV" ]; then
            git clone --branch dev "$REPO" /tmp/ksun >/dev/null 2>&1
            cd /tmp/ksun
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          else
            # setup.sh (branch "next") is run with "stable" in #6. Here we
            # approximate that with the newest tag of the repo.
            git clone --branch next "$REPO" /tmp/ksun >/dev/null 2>&1
            cd /tmp/ksun
            git fetch --tags -q || true
            TAG=$(git tag --sort=-v:refname | head -n1)
            [ -n "$TAG" ] && git checkout -q "$TAG" || TAG=next
          fi
          CODE=$((30000 + $(git rev-list --count HEAD)))
          SHA=$(git rev-parse --short HEAD)
          {
            echo "ksu_tag=$TAG"; echo "ksu_code=$CODE"; echo "ksu_sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "KernelSU-Next $KSU_VAR: $TAG ($CODE) @ $SHA"
          grep -q KSU_VERSION_FALLBACK kernel/Kbuild \
            || echo "::warning::kernel/Kbuild has no KSU_VERSION_FALLBACK - the v0.0.1 fix may need updating"

      - name: SUSFS patch dry-run on KernelSU-Next (susfs=true)
        if: env.SUSFS == 'true' && env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          mkdir -p "$G_EXT"
          git clone --depth 1 "$SUSFS_REPO" "$G_EXT/SUSFS"
          P=$(find "$G_EXT/SUSFS" -type f -name '10_enable_susfs_for_ksu.patch' -not -path '*/.git/*' | head -n1)
          [ -n "$P" ] || { echo "::error::10_enable_susfs_for_ksu.patch not found in $SUSFS_REPO"; exit 1; }
          cd /tmp/ksun
          if patch -p1 --dry-run --forward --batch < "$P" > /tmp/ksu_susfs.log 2>&1; then
            cat /tmp/ksu_susfs.log
            echo "OK - 10_enable_susfs_for_ksu.patch applies to KernelSU-Next ($KSU_VAR)"
          else
            cat /tmp/ksu_susfs.log
            echo "::error::10_enable_susfs_for_ksu.patch does NOT apply to KernelSU-Next ($KSU_VAR). It is written for upstream KernelSU (tiann) - the file layout / code differs."
            exit 1
          fi

      - name: Defconfig plan
        run: |
          set -eu
          echo "gki_defconfig additions for $KSU_VAR, susfs=$SUSFS (between the '# >>> a346e-ci' markers):"
          if [ "$KSU_VAR" = "NO-ROOT" ]; then
            echo "  (none)"
          elif [ "$SUSFS" = "true" ]; then
            echo "  CONFIG_KSU=y, CONFIG_MODULES=y + every CONFIG_KSU_SUSFS_* symbol found in the patched Kconfig (no KPROBES needed, SUSFS uses inline hooks)"
          else
            echo "  CONFIG_KSU=y, CONFIG_KPROBES=y, CONFIG_KPROBE_EVENTS=y, CONFIG_MODULES=y"
          fi
          echo "  + CONFIG_IP_SET* (all variants)"
          {
            echo "### #5 KernelSU - OK"
            echo "- KernelSU-Next (\`${KSU_VAR}\`): \`${{ steps.resolve.outputs.ksu_tag || 'n/a' }}\` (\`${{ steps.resolve.outputs.ksu_code || 'n/a' }}\`) @ \`${{ steps.resolve.outputs.ksu_sha || 'n/a' }}\`"
            echo "- SUSFS on KernelSU-Next: \`${SUSFS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #6 Build -- the real one. Self-contained: fresh runner, fresh checkout.
  # ==========================================================================
  build:
    name: "#6 Build"
    needs: kernelsu
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    outputs:
      image_size: ${{ steps.build.outputs.image_size }}
      image_sha: ${{ steps.build.outputs.image_sha }}
      zip_name: ${{ steps.pack.outputs.zip_name }}
      zip_size: ${{ steps.pack.outputs.zip_size }}
      zip_sha: ${{ steps.pack.outputs.zip_sha }}
      artifact: ${{ steps.meta.outputs.artifact }}
      selinux: ${{ steps.meta.outputs.selinux }}
      ksu_tag: ${{ steps.ksu.outputs.ksu_tag }}
      ksu_code: ${{ steps.ksu.outputs.ksu_code }}
      susfs_ver: ${{ steps.susfs.outputs.susfs_ver }}
      susfs_sha: ${{ steps.susfs.outputs.susfs_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -eu
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby || true
          sudo apt-get remove --purge -y '^php.*' '^dotnet-.*' '^mysql-.*' \
                      '^firefox.*' '^mongodb-.*' '^postgresql-.*' azure-cli \
                      google-chrome-stable google-cloud-cli >/dev/null 2>&1 || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          sudo apt-get clean || true
          echo "--- after ---"; df -h /

      - name: Install host dependencies
        run: |
          set -eu
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            curl wget unzip zip git rsync ca-certificates \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev dwarves \
            lz4 zstd cpio libxml2-utils xsltproc \
            python3 python3-pip python3-setuptools python3-dev \
            zlib1g-dev libbz2-dev liblz4-dev libzstd-dev
          git config --global user.email "builder@example.com"
          git config --global user.name  "Builder"
          git config --global --add safe.directory "*"

      - name: Set kernel dir & artifact name
        id: meta
        run: |
          set -eu
          if [ -f "Kernel-6.6/Makefile" ]; then REAL_DIR=Kernel-6.6
          elif [ -f "kernel-6.6/Makefile" ]; then REAL_DIR=kernel-6.6
          else echo "::error::no kernel tree found"; exit 1; fi
          echo "REAL_DIR=$REAL_DIR" >> "$GITHUB_ENV"
          echo "G_KERNEL=$GITHUB_WORKSPACE/$REAL_DIR" >> "$GITHUB_ENV"
          SEL=$([ "$PERMISSIVE" = "true" ] && echo permissive || echo enforcing)
          CUS=$([ "$CUSTOM_PATCH" = "true" ] && echo custom || echo nocustom)
          SUS=$([ "$SUSFS" = "true" ] && echo susfs || echo nosusfs)
          echo "selinux=$SEL" >> "$GITHUB_OUTPUT"
          echo "artifact=A346E-AnyKernel3-${KSU_VAR}-${SUS}-${SEL}-${CUS}" >> "$GITHUB_OUTPUT"

      - name: SUSFS - fetch & patch kernel (susfs=true)
        id: susfs
        if: env.SUSFS == 'true'
        run: |
          set -eu
          mkdir -p "$G_EXT"
          git clone --depth 1 "$SUSFS_REPO" "$G_EXT/SUSFS"
          P=$(find "$G_EXT/SUSFS" -type f -name '50_add_susfs_in_gki-android15-6.6.patch' -not -path '*/.git/*' | head -n1)
          [ -n "$P" ] || { echo "::error::50_add_susfs_in_gki-android15-6.6.patch not found in $SUSFS_REPO"; exit 1; }
          D=$(dirname "$(dirname "$P")")
          echo "SUSFS_DIR=$D" >> "$GITHUB_ENV"
          VER=$(grep -m1 '#define SUSFS_VERSION' "$D/kernel_patches/include/linux/susfs.h" | sed 's/.*"\(.*\)".*/\1/')
          SHA=$(git -C "$G_EXT/SUSFS" rev-parse --short HEAD)
          { echo "susfs_ver=${VER:-unknown}"; echo "susfs_sha=$SHA"; } >> "$GITHUB_OUTPUT"
          echo "SUSFS ${VER:-unknown} @ $SHA"

          cp -v "$D"/kernel_patches/include/linux/* "$G_KERNEL/include/linux/"
          cp -v "$D"/kernel_patches/fs/*            "$G_KERNEL/fs/"

          if ! patch -p1 -d "$G_KERNEL" --forward --batch --no-backup-if-mismatch < "$P" > /tmp/susfs_kernel.log 2>&1; then
            cat /tmp/susfs_kernel.log
            echo "::error::SUSFS kernel patch failed - rejected hunks:"
            find "$G_KERNEL" -name '*.rej' | head -n 30
            exit 1
          fi
          cat /tmp/susfs_kernel.log
          if find "$G_KERNEL" -name '*.rej' | grep -q .; then
            echo "::error::SUSFS patch left .rej files"; find "$G_KERNEL" -name '*.rej'; exit 1
          fi
          if grep -q 'fuzz' /tmp/susfs_kernel.log; then
            echo "::warning::SUSFS kernel patch applied with fuzz - check the log"
          fi

          # GKI protected exports block SUSFS symbols (README step 11)
          grep -rl "protected_exports_list" --include="BUILD.bazel" "$GITHUB_WORKSPACE/$REAL_DIR" 2>/dev/null | while read -r f; do
            sed -i '/"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",\?/d' "$f"
          done
          find "$GITHUB_WORKSPACE/$REAL_DIR" -iname "abi_gki_protected_exports*" -type f -delete 2>/dev/null || true

      - name: Add KernelSU-Next
        id: ksu
        if: env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          cd "$G_KERNEL"
          rm -rf KernelSU-Next
          case "$KSU_VAR" in
            KSUN-DEV)
              # setup.sh does a FRESH clone every run -> always the newest dev HEAD.
              curl -LSs --retry 3 "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" -o /tmp/ksun_setup.sh
              bash /tmp/ksun_setup.sh dev
              ;;
            KSUN-STABLE)
              # same as: curl -LSs ".../KernelSU-Next/next/kernel/setup.sh" | bash -s stable
              curl -LSs --retry 3 "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" -o /tmp/ksun_setup.sh
              bash /tmp/ksun_setup.sh stable
              ;;
          esac
          [ -d KernelSU-Next ] || { echo "::error::KernelSU-Next missing after setup.sh"; exit 1; }

          cd KernelSU-Next
          # KernelSU-Next as fetched (before SUSFS) defines the version
          KSU_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          KSU_CODE=$((30000 + $(git rev-list --count HEAD 2>/dev/null || echo 0)))
          KSU_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)

          if [ "$SUSFS" = "true" ]; then
            P="$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
            [ -f "$P" ] || { echo "::error::$P missing"; exit 1; }
            if ! patch -p1 --forward --batch --no-backup-if-mismatch < "$P" > /tmp/ksu_susfs.log 2>&1; then
              cat /tmp/ksu_susfs.log
              echo "::error::10_enable_susfs_for_ksu.patch failed on KernelSU-Next - rejected hunks:"
              find . -name '*.rej' | head -n 30
              exit 1
            fi
            cat /tmp/ksu_susfs.log
            if find . -name '*.rej' | grep -q .; then
              echo "::error::SUSFS KernelSU patch left .rej files"; find . -name '*.rej'; exit 1
            fi
            grep -qE '^config KSU_SUSFS[[:space:]]*$' kernel/Kconfig \
              || { echo "::error::kernel/Kconfig has no KSU_SUSFS symbol after patching"; exit 1; }
            echo "KernelSU-Next patched with SUSFS"
          fi

          # Fix "v0.0.1 (1-2)" in the manager: build_kernel.sh copies the tree
          # into the bazel workspace with `rsync --copy-links`, which turns the
          # drivers/kernelsu -> ../KernelSU-Next/kernel symlink into a plain
          # copy. Kbuild can then no longer find its own git repo and falls back
          # to KSU_VERSION=1 / KSU_VERSION_TAG=v0.0.1 -> bake in the real values.
          if [ -f kernel/Kbuild ] && grep -q KSU_VERSION_FALLBACK kernel/Kbuild; then
            sed -i "s|^KSU_VERSION_FALLBACK := .*|KSU_VERSION_FALLBACK := ${KSU_CODE}|"        kernel/Kbuild
            sed -i "s|^KSU_VERSION_TAG_FALLBACK := .*|KSU_VERSION_TAG_FALLBACK := ${KSU_TAG}|" kernel/Kbuild
            grep -n "KSU_VERSION_FALLBACK\|KSU_VERSION_TAG_FALLBACK" kernel/Kbuild
          else
            echo "::warning::KSU_VERSION_FALLBACK not found in kernel/Kbuild (layout changed?)"
          fi
          { echo "KSU_GIT_TAG=$KSU_TAG"; echo "KSU_VERSION=$KSU_CODE"; echo "KSU_COMMIT=$KSU_SHA"; } >> "$GITHUB_ENV"
          { echo "ksu_tag=$KSU_TAG"; echo "ksu_code=$KSU_CODE"; } >> "$GITHUB_OUTPUT"
          echo "KernelSU-Next $KSU_TAG ($KSU_CODE) @ $KSU_SHA  [variant=$KSU_VAR susfs=$SUSFS]"

      - name: Defconfig (KSU + SUSFS + IPSet)
        run: |
          set -eu
          DEFCONFIG="$G_KERNEL/arch/arm64/configs/gki_defconfig"

          # SUSFS symbols: only ask for the ones the patched Kconfig really has
          # (option names change between SUSFS versions).
          SUSFS_LINES=()
          if [ "$KSU_VAR" != "NO-ROOT" ] && [ "$SUSFS" = "true" ]; then
            KCFG="$G_KERNEL/KernelSU-Next/kernel/Kconfig"
            for s in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                     KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                     KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
              if grep -qE "^config ${s}[[:space:]]*\$" "$KCFG"; then
                SUSFS_LINES+=("CONFIG_${s}=y")
              elif [ "$s" = "KSU_SUSFS" ]; then
                echo "::error::KSU_SUSFS not found in $KCFG"; exit 1
              else
                echo "::warning::$s does not exist in the patched Kconfig - skipped"
              fi
            done
          fi

          # Everything we add lives between markers, so re-running only ever
          # replaces our own block and never touches upstream lines.
          sed -i '/^# >>> a346e-ci$/,/^# <<< a346e-ci$/d' "$DEFCONFIG"
          {
            echo "# >>> a346e-ci"
            case "$KSU_VAR" in
              KSUN-DEV|KSUN-STABLE)
                echo "CONFIG_KSU=y"
                echo "CONFIG_MODULES=y"
                if [ "$SUSFS" = "true" ]; then
                  printf '%s\n' "${SUSFS_LINES[@]}"
                else
                  echo "CONFIG_KPROBES=y"
                  echo "CONFIG_KPROBE_EVENTS=y"
                fi
                ;;
            esac
            # IPSet (needed by most firewall / adblock apps) -- all variants
            echo "CONFIG_IP_SET=y"
            echo "CONFIG_IP_SET_MAX=65534"
            for t in BITMAP_IP BITMAP_IPMAC BITMAP_PORT HASH_IP HASH_IPMARK HASH_IPPORT \
                     HASH_IPPORTIP HASH_IPPORTNET HASH_IPMAC HASH_MAC HASH_NETPORTNET \
                     HASH_NET HASH_NETNET HASH_NETPORT HASH_NETIFACE LIST_SET; do
              echo "CONFIG_IP_SET_${t}=y"
            done
            echo "# <<< a346e-ci"
          } >> "$DEFCONFIG"
          echo "--- defconfig tail ---"; tail -n 40 "$DEFCONFIG"

      # build_kernel.sh applies, in this order:
      #   apply_optional_patches : Permissive/ (PERMISSIVE=true) + patch/*.patch (CUSTOM_PATCH=true)
      #   apply_kernel66_patches : kernel/patches-kernel-6.6/*.patch (always)
      #   apply_compat_fixes     : inline loop.h / MAX-MIN / SEC_PM fixes
      - name: Build kernel
        id: build
        run: |
          set -eu
          chmod +x ./build_kernel.sh
          echo "PERMISSIVE=$PERMISSIVE  CUSTOM_PATCH=$CUSTOM_PATCH  KSU_VAR=$KSU_VAR  SUSFS=$SUSFS"
          if ! bash ./build_kernel.sh 2>&1 | tee build.log; then
            echo "::error::build_kernel.sh failed - see the build-log artifact"
            tail -n 60 build.log || true
            exit 1
          fi
          [ -f Image ] || { echo "::error::Image not produced"; find out -name Image -type f | head; exit 1; }
          echo "image_size=$(du -h Image | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "image_sha=$(sha256sum Image | cut -c1-16)"    >> "$GITHUB_OUTPUT"
          if [ "$PERMISSIVE" = "true" ]; then
            grep -q "SELinux permissive patch" build.log || echo "::warning::permissive requested but not confirmed in the log"
          fi
          ls -lh Image

      # Drop the fresh Image into the AnyKernel3 repo and build the final
      # flashable zip (same command as upstream AnyKernel3's README).
      - name: Package AnyKernel3 zip
        id: pack
        run: |
          set -eu
          [ -s Image ] || { echo "::error::Image is missing or empty"; exit 1; }
          rm -rf AnyKernel3
          git clone --depth 1 "$ANYKERNEL_REPO" AnyKernel3
          AK_SHA=$(git -C AnyKernel3 rev-parse --short HEAD)
          cd AnyKernel3
          [ -f anykernel.sh ] || { echo "::error::anykernel.sh missing in $ANYKERNEL_REPO"; ls -la; exit 1; }

          # remove any kernel image the repo ships so ONLY the fresh one is flashed
          for f in Image Image.gz Image.gz-dtb Image.lz4 Image.lz4-dtb Image.bz2 Image.lzma Image.lzo zImage zImage-dtb; do
            if [ -e "$f" ]; then echo "removing stale $f"; rm -f "$f"; fi
          done
          cp -v ../Image ./Image

          SEL=$([ "$PERMISSIVE" = "true" ] && echo permissive || echo enforcing)
          SUS=$([ "$SUSFS" = "true" ] && echo susfs || echo nosusfs)
          NAME="A346E-${KSU_VAR}-${SUS}-${SEL}-$(date -u +%Y%m%d-%H%M).zip"
          mkdir -p ../dist
          zip -r9 "../dist/$NAME" * -x .git README.md '*placeholder' '*.zip' > /dev/null

          # sanity: the zip must contain our Image and the installer script
          unzip -Z1 "../dist/$NAME" > /tmp/zip.lst
          grep -qx 'Image'        /tmp/zip.lst || { echo "::error::Image not inside $NAME"; cat /tmp/zip.lst; exit 1; }
          grep -qx 'anykernel.sh' /tmp/zip.lst || { echo "::error::anykernel.sh not inside $NAME"; cat /tmp/zip.lst; exit 1; }
          echo "--- $NAME (AnyKernel3 @ $AK_SHA) ---"; cat /tmp/zip.lst

          {
            echo "zip_name=$NAME"
            echo "zip_size=$(du -h "../dist/$NAME" | awk '{print $1}')"
            echo "zip_sha=$(sha256sum "../dist/$NAME" | cut -c1-16)"
          } >> "$GITHUB_OUTPUT"

      # The zip is already compressed -> store it as-is (GitHub wraps every
      # artifact in one more zip on download; unzip once to get the flashable file).
      - name: Upload flashable zip
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: dist/${{ steps.pack.outputs.zip_name }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log (only when the build fails)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          if-no-files-found: warn

  # ==========================================================================
  # #7 Upload & Summary
  # ==========================================================================
  upload-summary:
    name: "#7 Upload & Summary"
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Report
        run: |
          set -eu
          {
            echo "### #7 Result: \`${{ needs.build.result }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| KSU variant | \`${KSU_VAR}\` |"
            echo "| KernelSU-Next | \`${{ needs.build.outputs.ksu_tag || 'n/a' }}\` (\`${{ needs.build.outputs.ksu_code || 'n/a' }}\`) |"
            echo "| SUSFS | \`${SUSFS}\` \`${{ needs.build.outputs.susfs_ver || '-' }}\` @ \`${{ needs.build.outputs.susfs_sha || '-' }}\` |"
            echo "| SELinux | \`${{ needs.build.outputs.selinux || env.PERMISSIVE }}\` |"
            echo "| Image | \`${{ needs.build.outputs.image_size || 'n/a' }}\` sha256:\`${{ needs.build.outputs.image_sha || 'n/a' }}\` |"
            echo "| Flashable zip | \`${{ needs.build.outputs.zip_name || 'n/a' }}\` (\`${{ needs.build.outputs.zip_size || 'n/a' }}\`, sha256:\`${{ needs.build.outputs.zip_sha || 'n/a' }}\`) |"
            echo "| Artifact | \`${{ needs.build.outputs.artifact || 'n/a' }}\` |"
            echo ""
            echo "Pipeline: #1 ●──● #2 ●──● #3 ●──● #4 ●──● #5 ●──● #6 ●──● #7"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when the build fails
        if: needs.build.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cat > issue.md <<EOF
          Build failed: [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          | field | value |
          |---|---|
          | commit | \`${{ github.sha }}\` |
          | branch | \`${{ github.ref_name }}\` |
          | KSU | \`${KSU_VAR}\` |
          | susfs | \`${SUSFS}\` |
          | permissive | \`${PERMISSIVE}\` |
          | extra patches | \`${CUSTOM_PATCH}\` |

          The \`build-log-${{ github.run_id }}\` artifact of that run has the full log.
          EOF
          gh issue create --title "Build failed #${{ github.run_id }} [${KSU_VAR}, susfs=${SUSFS}]" --body-file issue.md || true
